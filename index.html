<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Achados pra Casa</title>
<meta name="description" content="Os achados mais úteis pra cozinha, banheiro e quarto, com link direto pra comprar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --creme:#FAF6F1; --areia:#F1E2D4; --terracota:#C05A32; --terracota-claro:#E08A5F;
    --texto:#241D19; --suave:#7A6E66; --borda:rgba(36,29,25,.08);
    --titulo:'Bricolage Grotesque', system-ui, sans-serif;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; padding-inline:18px; color:var(--texto);
    font:16px/1.45 'Poppins', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(rgba(36,29,25,.05) 1.5px, transparent 1.6px) 0 0 / 26px 26px,
      radial-gradient(120% 60% at 50% 0%, #FFFDFB 0%, var(--creme) 45%, #F2E7DC 100%);
    background-attachment:fixed;
  }
  .pagina { max-width:620px; margin:0 auto; padding-block:34px 44px; }

  .previa {
    background:#FFF3CD; border:1px solid #F0D98A; color:#6B5300;
    border-radius:14px; padding:12px 14px; font-size:13.5px; margin-bottom:22px; text-align:center;
  }

  header { text-align:center; margin-bottom:26px; }
  .arroba {
    display:inline-block; background:var(--areia); color:var(--terracota);
    border-radius:999px; padding:7px 18px; font-size:13px; font-weight:700; letter-spacing:1.4px;
    text-transform:uppercase; margin-bottom:14px;
  }
  h1 {
    font-family:var(--titulo); font-weight:800; font-size:38px; line-height:1.08;
    letter-spacing:-.8px; margin:0;
  }
  h1 .destaque {
    color:var(--terracota);
    background:linear-gradient(180deg, transparent 56%, rgba(192,90,50,.20) 56%, rgba(192,90,50,.20) 93%, transparent 93%);
    padding:0 .06em; border-radius:6px;
  }
  .descricao { color:var(--suave); margin:12px auto 0; max-width:420px; font-size:15px; }

  .dica { display:block; text-align:center; font-size:15px; font-weight:500; margin-bottom:10px; }
  .dica b { color:var(--terracota); }
  .busca {
    width:100%; padding:15px 18px; font:inherit; font-size:17px; border-radius:16px;
    border:1px solid var(--borda); background:#fff; color:var(--texto);
    box-shadow:0 2px 4px rgba(36,29,25,.03), 0 12px 26px rgba(36,29,25,.06);
  }
  .busca::placeholder { color:#B3A79E; }
  .busca:focus { outline:2px solid var(--terracota); outline-offset:1px; }

  .chips { display:flex; gap:9px; overflow-x:auto; padding:16px 2px 6px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip {
    flex:none; border:1px solid var(--borda); background:#fff; color:var(--texto);
    padding:9px 16px; border-radius:999px; font:inherit; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .chip[aria-pressed="true"] {
    background:linear-gradient(135deg, var(--terracota-claro), var(--terracota));
    border-color:transparent; color:#fff; box-shadow:0 8px 18px rgba(192,90,50,.28);
  }

  .grade { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:26px 14px; margin-top:22px; }
  @media (min-width:560px) { .grade { grid-template-columns:repeat(3, minmax(0,1fr)); gap:30px 18px; } }

  .card {
    position:relative; background:#fff; border:1px solid var(--borda); border-radius:24px;
    display:flex; flex-direction:column; padding:10px 10px 12px;
    box-shadow:0 2px 4px rgba(36,29,25,.04), 0 16px 34px rgba(36,29,25,.09);
  }
  /* selo do número na quina, por fora da foto, igual às capas do feed */
  .numero {
    position:absolute; top:-11px; left:-9px; z-index:2;
    background:#fff; color:var(--terracota); border:2px solid var(--terracota);
    font-size:12.5px; font-weight:700; padding:5px 13px; border-radius:999px;
    box-shadow:0 6px 14px rgba(36,29,25,.12);
  }
  .foto {
    aspect-ratio:1; border-radius:18px; overflow:hidden; background:#fff;
    display:grid; place-items:center; font-size:40px;
  }
  .foto img { width:100%; height:100%; object-fit:contain; }

  .info { display:flex; flex-direction:column; gap:7px; flex:1; padding:10px 4px 0; }
  .nome {
    font-size:13.5px; font-weight:600; line-height:1.3; margin:0;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .preco { font-family:var(--titulo); font-weight:800; font-size:19px; line-height:1.1; }
  .preco small { display:block; font-family:'Poppins',sans-serif; font-size:10.5px; font-weight:400; color:var(--suave); margin-top:2px; }
  .loja { font-size:11px; font-weight:600; color:var(--suave); letter-spacing:.4px; }

  .comprar {
    margin-top:auto; display:block; text-align:center; text-decoration:none;
    background:linear-gradient(135deg, var(--terracota-claro), var(--terracota)); color:#fff;
    padding:11px 8px; border-radius:14px; font-size:13.5px; font-weight:700;
    box-shadow:0 8px 18px rgba(192,90,50,.26);
  }
  .vazio { text-align:center; color:var(--suave); padding:36px 0; grid-column:1 / -1; }

  footer { margin-top:34px; text-align:center; color:var(--suave); font-size:12px; line-height:1.6; }
</style>
</head>
<body>
<div class="pagina">
  
  <header>
    <div class="arroba">@oachadopracasa</div>
    <h1>Achados pra <span class="destaque">Casa</span></h1>
    <p class="descricao">Os achados mais úteis pra cozinha, banheiro e quarto, com link direto pra comprar.</p>
  </header>

  <label class="dica" for="busca">Viu no post? Digite o <b>número do produto</b> 👇</label>
  <input class="busca" id="busca" type="search" placeholder="Ex.: 12, ou busque pelo nome" aria-label="Número ou nome do produto">
  <div class="chips" id="chips" role="toolbar" aria-label="Filtrar por cômodo">
    <button class="chip" data-cat="" aria-pressed="true">Todos</button>
    <button class="chip" data-cat="cozinha" aria-pressed="false">🍳 Cozinha</button>
    <button class="chip" data-cat="banheiro" aria-pressed="false">🛁 Banheiro</button>
    <button class="chip" data-cat="quarto" aria-pressed="false">🛏️ Quarto</button>
    <button class="chip" data-cat="sala" aria-pressed="false">🛋️ Sala</button>
    <button class="chip" data-cat="lavanderia" aria-pressed="false">🧺 Lavanderia</button>
    <button class="chip" data-cat="organizacao" aria-pressed="false">📦 Organização</button>
    <button class="chip" data-cat="limpeza" aria-pressed="false">🧹 Limpeza</button>
  </div>

  <main class="grade" id="grade"></main>

  <footer>
    <p>Alguns links são de afiliado: posso receber uma comissão pelas compras, sem nenhum custo extra pra você.</p>
    <p>Preços e disponibilidade podem mudar, confira na loja.</p>
  </footer>
</div>

/file/sg-11134201-7req6-m8dk5gglfv7k20","preco":34.99},{"id":27,"nome":"Espelho Orgânico Grande com LED","loja":"shopee","categoria":"quarto","link":"https://s.shopee.com.br/9059WIhUDF","imagem":"https://down-br.img.susercontent.com/file/br-11134207-820ll-mslrmo2fppfq1b","preco":78.99},{"id":26,"nome":"Lava-Roupas Omo Líquido 7L","loja":"shopee","categoria":"lavanderia","link":"https://s.shopee.com.br/AUtxIfY8Nb","imagem":"https://down-br.img.susercontent.com/file/sg-11134201-7rau5-mau62igmy63506","preco":99.89},{"id":25,"nome":"Kit 12 Potes Herméticos 800ml","loja":"shopee","categoria":"organizacao","link":"https://s.shopee.com.br/20vPB34UdA","imagem":"https://down-br.img.susercontent.com/file/br-11134207-820lc-mlziaikq0bgk4a","preco":37.49},{"id":24,"nome":"Jogo 6 Copos Diamond de Vidro","loja":"shopee","categoria":"cozinha","link":"https://s.shopee.com.br/80CcK4heS8","imagem":"https://down-br.img.susercontent.com/file/promo-dim-0100c3fd7c69a822085cb58fea0c11dc36f6","preco":26.95},{"id":23,"nome":"Jogo de Lençol 400 Fios Micropercal","loja":"shopee","categoria":"quarto","link":"https://s.shopee.com.br/9zxghka2OS","imagem":"https://down-br.img.susercontent.com/file/promo-dim-0100353d6e7087420f747e0ae8858fabb7ba","preco":13.7},{"id":22,"nome":"Jogo 6 Taças Diamond de Vidro","loja":"shopee","categoria":"cozinha","link":"https://s.shopee.com.br/1AKnNC6gq","imagem":"https://down-br.img.susercontent.com/file/br-11134207-820lg-mr201woae6thda","preco":35.99},{"id":21,"nome":"Jogo de Panelas 10 Peças Antiaderente","loja":"shopee","categoria":"cozinha","link":"https://s.shopee.com.br/8AW2WNh17B","imagem":"https://down-br.img.susercontent.com/file/br-11134207-820m6-ms42s3kelced28","preco":177.9},{"id":20,"nome":"Projetor Portátil HY300 Wi-Fi","loja":"shopee","categoria":"sala","link":"https://s.shopee.com.br/9KhzuWcZkG","imagem":"https://down-br.img.susercontent.com/file/sg-11134201-8262y-ml8364ncclj703","preco":185.99},{"id":19,"nome":"Percarbonato Tira Manchas","loja":"sho susercontent.com/file/sg-11134201-8257t-msk294deek9517","preco":149.9},{"id":10,"nome":"Cafeteira Philco 15 Cafezinhos","loja":"shopee","categoria":"cozinha","link":"https://s.shopee.com.br/8pliJr7Z9M","imagem":"https://down-br.img.susercontent.com/file/sg-11134201-8258o-msk2369yxddtf4","preco":99.9},{"id":9,"nome":"Mini Liquidificador Portátil USB","loja":"shopee","categoria":"cozinha","link":"https://s.shopee.com.br/9fKpJO4OSV","imagem":"https://down-br.img.susercontent.com/file/br-11134207-7r98o-m326ai6rx4gl9c","preco":22.04},{"id":8,"nome":"Espremedor de Frutas Elétrico USB","loja":"shopee","categoria":"cozinha","link":"https://s.shopee.com.br/9peFVh3l7W","imagem":"https://down-br.img.susercontent.com/file/sg-11134201-8259f-msgkvfvn2sju02","preco":61.69},{"id":7,"nome":"Chaleira Elétrica Inox com Desligamento Automático","loja":"shopee","categoria":"cozinha","link":"https://s.shopee.com.br/9Khyum5f8P","imagem":"https://down-br.img.susercontent.com/file/br-11134207-820lc-mreq8encuolh62","preco":43.9},{"id":6,"nome":"Cozedor de Ovos Elétrico","loja":"shopee","categoria":"cozinha","link":"https://s.shopee.com.br/9V1P7551nQ","imagem":"https://down-br.img.susercontent.com/file/br-11134207-81z1k-mfytb2po8gzk07","preco":29.98},{"id":5,"nome":"Chaleira Elétrica Inox 1,8L","loja":"shopee","categoria":"cozinha","link":"https://s.shopee.com.br/AKaW6c1r6Z","imagem":"https://down-br.img.susercontent.com/file/br-11134207-820lg-mqfmutp6p53522","preco":44.59},{"id":4,"nome":"Chave T para Máquina de Lavar 10mm","loja":"shopee","categoria":"lavanderia","link":"https://s.shopee.com.br/AUtwIv1Dla","imagem":"https://down-br.img.susercontent.com/file/promo-dim-0100c60c95fde39beb972ee748354e938778","preco":23.74},{"id":3,"nome":"Picador e Processador Elétrico de Alimentos","loja":"shopee","categoria":"cozinha","link":"https://s.shopee.com.br/9zxfi037mT","imagem":"https://down-br.img.susercontent.com/file/sg-11134201-8262e-mjejrub4w35z78","preco":69.98},{"id":2,"nome":"Mixer Batedor Elétrico 2 em 1","loja":"shopee","categoria":"cozinha","link":"https://s.shopee.com.br/AAH5uJ2URU","imagem":"https://down-br.img.susercontent.com/file/sg-11134201-7rd48-lupf3z3a40mxf1","preco":18.99},{"id":1,"nome":"Omeleteira Agratto Mr Cheff Inox Redonda 127v / 220v","loja":"shopee","categoria":"cozinha","link":"https://s.shopee.com.br/1gIWFICgF0","imagem":"https://down-br.img.susercontent.com/file/br-11134207-820ll-mmc8h9uyaoee6b","preco":null}]};
  const grade = document.getElementById('grade');
  const busca = document.getElementById('busca');
  const chips = document.getElementById('chips');
  let categoria = '';

  const normalizar = (s) => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const reais = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

  function card(p) {
    const cat = DADOS.categorias[p.categoria];
    const el = document.createElement('article');
    el.className = 'card';

    const num = document.createElement('span');
    num.className = 'numero';
    num.textContent = 'Nº ' + p.id;

    const foto = document.createElement('div');
    foto.className = 'foto';
    if (p.imagem) {
      const img = document.createElement('img');
      img.src = p.imagem; img.alt = p.nome; img.loading = 'lazy';
      foto.append(img);
    } else {
      foto.textContent = cat ? cat.emoji : '🏠';
    }

    const info = document.createElement('div');
    info.className = 'info';

    const nome = document.createElement('h2');
    nome.className = 'nome'; nome.textContent = p.nome;
    info.append(nome);

    if (p.preco != null) {
      const preco = document.createElement('div');
      preco.className = 'preco';
      preco.textContent = reais(p.preco);
      const nota = document.createElement('small');
      nota.textContent = 'último preço visto';
      preco.append(nota);
      info.append(preco);
    } else {
      const loja = document.createElement('div');
      loja.className = 'loja';
      loja.textContent = DADOS.lojas[p.loja];
      info.append(loja);
    }

    const link = document.createElement('a');
    link.className = 'comprar';
    link.href = p.link; link.target = '_blank'; link.rel = 'noopener sponsored';
    link.textContent = p.loja === 'shopee' ? 'Ver na Shopee' : 'Ver no Mercado Livre';
    info.append(link);

    el.append(num, foto, info);
    return el;
  }

  function render() {
    const termo = normalizar(busca.value.trim().replace(/^n[º°o]?\s*/i, ''));
    const porNumero = /^\d+$/.test(termo);
    const lista = DADOS.produtos.filter((p) => {
      if (porNumero) return String(p.id) === String(Number(termo));
      return (!categoria || p.categoria === categoria) && (!termo || normalizar(p.nome).includes(termo));
    });
    grade.replaceChildren(...lista.map(card));
    if (!lista.length) {
      const vazio = document.createElement('p');
      vazio.className = 'vazio';
      vazio.textContent = porNumero ? 'Nenhum produto com o nº ' + Number(termo) + '. Confira o número no post.' : 'Nenhum produto encontrado.';
      grade.append(vazio);
    }
  }

  busca.addEventListener('input', render);
  chips.addEventListener('click', (e) => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    categoria = btn.dataset.cat;
    for (const c of chips.children) c.setAttribute('aria-pressed', String(c === btn));
    render();
  });

  // Link direto para um produto: .../?n=12 (ou .../#12)
  const numeroInicial = new URLSearchParams(location.search).get('n') || location.hash.slice(1);
  if (/^\d+$/.test(numeroInicial)) busca.value = numeroInicial;
  render();
</script>
</body>
</html>
