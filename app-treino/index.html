<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0f10" media="(prefers-color-scheme: dark)">
  <title>Treino &amp; Dieta</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="view"></main>

  <div id="timer" class="timer hidden" role="status" aria-live="polite">
    <div class="timer-top">
      <div class="timer-main">
        <div class="timer-label">Descanso</div>
        <div id="timer-text" class="timer-text">0:00</div>
      </div>
      <button class="tbtn" data-act="timer-add" data-v="-15">−15</button>
      <button class="tbtn" data-act="timer-add" data-v="15">+15</button>
      <button class="tbtn go" data-act="timer-skip">Pular</button>
    </div>
    <div class="timer-track"><div id="timer-fill" class="timer-fill"></div></div>
  </div>

  <nav class="tabs" id="tabs"></nav>

  <dialog id="sheet" class="sheet"><form method="dialog" id="sheet-body" class="sheet-body"></form></dialog>

  <script src="app.js"></script>
</body>
</html>
